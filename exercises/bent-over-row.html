<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bent-over dumbbell row · 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0f12;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
canvas{display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:14px 16px;pointer-events:none;background:linear-gradient(#0d0f12ee,#0d0f1200)}
#hud h1{font-size:18px;font-weight:700}
#hud p{font-size:13px;color:#9aa0a6;margin-top:2px}
#cue{position:fixed;left:50%;top:76px;transform:translateX(-50%);padding:8px 14px;border-radius:20px;background:#ffffff14;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:15px;font-weight:600;white-space:nowrap;pointer-events:none;transition:color .2s}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#0d0f1200,#0d0f12f0 40%)}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
button{appearance:none;border:0;border-radius:18px;padding:8px 13px;font:600 13px -apple-system,Helvetica,Arial,sans-serif;background:#ffffff1a;color:#f2f2f7}
button.on{background:#30d158;color:#08130b}
#tips{font-size:12px;color:#9aa0a6;text-align:center;margin-top:8px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="hud"><h1>Bent-over dumbbell row</h1><p>3 × 12 to 15 · 8 kg per hand · drag to rotate, pinch to zoom</p></div>
<div id="cue">Loading 3D model…</div>
<div id="bar">
<div class="row" id="views">
<button data-v="q" class="on">3/4</button><button data-v="side">Side</button><button data-v="front">Front</button><button data-v="back">Back</button><button data-v="top">Top</button>
</div>
<div class="row">
<button id="play" class="on">Pause</button><button id="slow">Slow-mo</button><button id="mus" class="on">Muscles</button><button id="guide" class="on">Back line</button>
</div>
<div id="tips">Flat back at ~45° · eyes on the floor ahead · elbows close · pull to lower ribs</div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const cue=document.getElementById('cue'),play=document.getElementById('play'),slow=document.getElementById('slow'),mus=document.getElementById('mus'),gd=document.getElementById('guide');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d0f12);scene.fog=new THREE.Fog(0x0d0f12,6,14);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.05,50);camera.position.set(2.6,1.6,2.6);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0.75,0);controls.enableDamping=true;controls.minDistance=1.3;controls.maxDistance=7;controls.maxPolarAngle=Math.PI*0.495;
const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(3,5,2.5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-2,right:2,top:2,bottom:-2,near:0.5,far:12});key.shadow.radius=4;key.shadow.bias=-0.0004;scene.add(key);
const rim=new THREE.DirectionalLight(0x7fb4ff,1.6);rim.position.set(-3,2.5,-3);scene.add(rim);
scene.add(new THREE.HemisphereLight(0xbfd4ff,0x1a1410,0.4));
const floor=new THREE.Mesh(new THREE.CircleGeometry(4,96),new THREE.MeshStandardMaterial({color:0x1a1d22,roughness:0.85}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.15,1.17,128),new THREE.MeshBasicMaterial({color:0x30d158,transparent:true,opacity:0.35}));ring.rotation.x=-Math.PI/2;ring.position.y=0.002;scene.add(ring);
const grid=new THREE.GridHelper(8,32,0x2a2f36,0x20242a);grid.position.y=0.001;grid.material.transparent=true;grid.material.opacity=0.5;scene.add(grid);

// dumbbells
const iron=new THREE.MeshStandardMaterial({color:0x1b1d20,roughness:0.35,metalness:0.85}),chrome=new THREE.MeshStandardMaterial({color:0xcfd3d8,roughness:0.15,metalness:1});
function dumbbell(){const g=new THREE.Group();const h=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.17,20),chrome);g.add(h);
 for(const y of[-0.115,0.115]){const p=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.05,40),iron);p.position.y=y;g.add(p);}g.traverse(o=>o.castShadow=true);scene.add(g);return g;}
const DB={L:dumbbell(),R:dumbbell()};
// muscle glows
const red=new THREE.MeshBasicMaterial({color:0xff3b30,transparent:true,opacity:0,depthWrite:false});
const orange=new THREE.MeshBasicMaterial({color:0xff9f0a,transparent:true,opacity:0,depthWrite:false});
function glow(mat,sx,sy,sz){const m=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),mat);m.scale.set(sx,sy,sz);m.renderOrder=2;scene.add(m);return m;}
const M={latL:glow(red,0.09,0.17,0.035),latR:glow(red,0.09,0.17,0.035),rh:glow(red,0.11,0.08,0.03),tr:glow(orange,0.15,0.05,0.035),rdL:glow(orange,0.04,0.045,0.035),rdR:glow(orange,0.04,0.045,0.035)};
const guide=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,1,8),new THREE.MeshBasicMaterial({color:0x30d158}));scene.add(guide);

const F=V(0,0,1),U=V(0,1,0),Lx=V(1,0,0);
const HINGE=0.95,PELVIS=0.55;
const FING=['Index','Middle','Ring','Pinky'];
const B={},rest={};let model=null;
const AIM=[['Hips','Spine'],['Spine','Spine1'],['Spine1','Spine2'],['Spine2','Neck'],['Neck','Head'],['Head','HeadTop_End'],
 ['LeftUpLeg','LeftLeg'],['LeftLeg','LeftFoot'],['LeftFoot','LeftToeBase'],['RightUpLeg','RightLeg'],['RightLeg','RightFoot'],['RightFoot','RightToeBase'],
 ['LeftArm','LeftForeArm'],['LeftForeArm','LeftHand'],['LeftHand','LeftHandMiddle1'],['RightArm','RightForeArm'],['RightForeArm','RightHand'],['RightHand','RightHandMiddle1']];
for(const sd of['Left','Right']){for(const f of FING.concat(['Thumb']))for(let i=1;i<4;i++)AIM.push([sd+'Hand'+f+i,sd+'Hand'+f+(i+1)]);}
const tq=new THREE.Quaternion(),pq=new THREE.Quaternion(),tv=V(0,0,0),tv2=V(0,0,0);
function aim(n,d){const r=rest[n],b=B[n];if(!r||!b)return;
 tq.setFromUnitVectors(r.dir,d.clone().normalize()).multiply(r.q);
 b.parent.getWorldQuaternion(pq);b.quaternion.copy(pq.invert().multiply(tq));b.updateMatrixWorld(true);}
const tilt=(h)=>U.clone().multiplyScalar(Math.cos(h)).add(F.clone().multiplyScalar(Math.sin(h)));
const down=(ang,side,out)=>U.clone().multiplyScalar(-Math.cos(ang)).add(F.clone().multiplyScalar(-Math.sin(ang))).add(Lx.clone().multiplyScalar(side*out));
function pose(a){
 aim('Hips',tilt(PELVIS));aim('Spine',tilt(HINGE*0.9));aim('Spine1',tilt(HINGE));aim('Spine2',tilt(HINGE));aim('Neck',tilt(HINGE-0.15));aim('Head',tilt(HINGE-0.3));
 for(const [k,s] of[['Left',1],['Right',-1]]){
  aim(k+'UpLeg',down(-0.36,s,0.08));aim(k+'Leg',down(0.2,s,0.03));aim(k+'Foot',rest[k+'Foot'].dir);
  aim(k+'Arm',down(0.05+1.1*a,s,0.05+0.07*a));
  const fa=down(-0.05-0.1*a,s,0.1*a);aim(k+'ForeArm',fa);aim(k+'Hand',fa);
  const hd=fa.clone().normalize(),inn=Lx.clone().multiplyScalar(-s);
  const c1=hd.clone().multiplyScalar(0.45).add(inn.clone().multiplyScalar(0.89)),c2=hd.clone().multiplyScalar(-0.55).add(inn.clone().multiplyScalar(0.83)),c3=hd.clone().multiplyScalar(-0.95).add(inn.clone().multiplyScalar(0.3));
  for(const f of FING){aim(k+'Hand'+f+'1',c1);aim(k+'Hand'+f+'2',c2);aim(k+'Hand'+f+'3',c3);}
  aim(k+'HandThumb1',inn.clone().multiplyScalar(0.7).add(F.clone().multiplyScalar(0.5)).add(hd.clone().multiplyScalar(0.5)));
  const t2=inn.clone().multiplyScalar(0.6).add(hd.clone().multiplyScalar(0.8));aim(k+'HandThumb2',t2);aim(k+'HandThumb3',t2);
 }
}
const P=n=>B[n].getWorldPosition(V(0,0,0));
function overlays(a){
 const on=mus.classList.contains('on');red.opacity=on?0.15+0.5*a:0;orange.opacity=on?0.1+0.3*a:0;
 const sd=tilt(HINGE),back=U.clone().multiplyScalar(Math.sin(HINGE)).add(F.clone().multiplyScalar(-Math.cos(HINGE)));
 const q=new THREE.Quaternion().setFromUnitVectors(U,sd);
 const s1=P('Spine1'),s2=P('Spine2'),nk=P('Neck'),sp=P('Spine');
 const mid=s1.clone().lerp(s2,0.4).add(back.clone().multiplyScalar(0.06));
 M.latL.position.copy(mid).add(V(0.1,0,0));M.latR.position.copy(mid).add(V(-0.1,0,0));
 M.rh.position.copy(s2).lerp(nk,0.3).add(back.clone().multiplyScalar(0.07));
 M.tr.position.copy(nk).add(back.clone().multiplyScalar(0.035));
 for(const m of[M.latL,M.latR,M.rh,M.tr])m.quaternion.copy(q);
 M.rdL.position.copy(P('LeftArm')).add(back.clone().multiplyScalar(0.07));M.rdR.position.copy(P('RightArm')).add(back.clone().multiplyScalar(0.07));
 const h0=P('Hips'),ld=nk.clone().sub(h0).normalize(),bn=ld.clone().cross(Lx).normalize();const g0=h0.add(bn.clone().multiplyScalar(0.14)),g1=nk.clone().add(bn.clone().multiplyScalar(0.12));
 guide.position.copy(g0).lerp(g1,0.5);guide.scale.y=g0.distanceTo(g1);guide.quaternion.setFromUnitVectors(U,g1.clone().sub(g0).normalize());
 for(const [k,key2,s] of[['Left','L',1],['Right','R',-1]]){const h=P(k+'Hand'),f=P(k+'ForeArm');const d=h.clone().sub(f).normalize();
  const kn=B[k+'HandMiddle1']?P(k+'HandMiddle1'):h.clone().add(d.clone().multiplyScalar(0.09));
  DB[key2].position.copy(kn).add(V(-0.024*s,0,0)).add(d.multiplyScalar(0.012));DB[key2].quaternion.setFromUnitVectors(U,F);}
}
new GLTFLoader().load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/Xbot.glb',g=>{
 model=g.scene;scene.add(model);
 model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;}
  if(o.isBone){B[o.name.replace(/^mixamorig:?/,'').replace(/[^A-Za-z0-9_]/g,'')]=o;}});
 model.updateMatrixWorld(true);
 for(const [n,c] of AIM){if(!B[n]||!B[c])continue;const p=P(n),cp=P(c);rest[n]={dir:cp.sub(p).normalize(),q:B[n].getWorldQuaternion(new THREE.Quaternion())};}
 pose(0);model.updateMatrixWorld(true);
 const y=Math.min(P('LeftToeBase').y,P('LeftFoot').y-0.08,P('RightToeBase').y);model.position.y-=y;model.position.z=-0.08;model.updateMatrixWorld(true);
 ready=true;
},undefined,e=>{cue.textContent='Could not load the 3D model';console.error(e);});

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function amount(t){const T=t%4.2;
 if(T<1.0)return{a:ease(T),ph:'Pull to your lower ribs'};
 if(T<2.0)return{a:1,ph:'Squeeze shoulder blades · 1 sec'};
 if(T<4.0)return{a:1-ease((T-2)/2),ph:'Lower slowly · 2 sec'};
 return{a:0,ph:'Arms long · brace'};}
let ready=false,playing=true,speed=1,clockT=0,last=performance.now(),reps=0,prevA=0;
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play';play.classList.toggle('on',playing);};
slow.onclick=()=>{speed=speed===1?0.35:1;slow.classList.toggle('on',speed!==1);};
mus.onclick=()=>mus.classList.toggle('on');
gd.onclick=()=>gd.classList.toggle('on');
const views={q:[2.6,1.6,2.6],side:[3.3,0.95,0.0],front:[0,1.1,3.3],back:[0,1.5,-3.2],top:[0.01,4.2,0.6]};
let tw=null;
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#views button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tw={from:camera.position.clone(),to:V(...views[b.dataset.v]),t:0};});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(ready){if(playing)clockT+=dt*speed;const {a,ph}=amount(clockT);pose(a);overlays(a);guide.visible=gd.classList.contains('on');
  if(a>=1&&prevA<1)reps=reps%12+1;prevA=a;const txt=ph+' · rep '+reps+'/12';if(cue.textContent!==txt)cue.textContent=txt;cue.style.color=a>0.95?'#30d158':'#f2f2f7';}
 if(tw){tw.t=Math.min(1,tw.t+dt*1.6);camera.position.lerpVectors(tw.from,tw.to,ease(tw.t));if(tw.t>=1)tw=null;}
 controls.update();renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body></html>
