<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<title>Workouts</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1c1c1e;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
body{padding:10px 16px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.next{font-size:18px;font-weight:700}
.upd{font-size:11px;color:#8e8e93}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.bar .lab{font-size:12px;color:#aeaeb2;margin-bottom:3px;display:flex;justify-content:space-between}
.bar .lab b{color:#f2f2f7;font-weight:600}
.track{height:6px;border-radius:3px;background:#3a3a3c;overflow:hidden}
.fill{height:100%;border-radius:3px;background:#30d158}
.fill.part{background:#ffd60a}
h2{font-size:11px;color:#8e8e93;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:3px;font-size:13px}
.t{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.t span:last-child{color:#30d158;font-weight:600}
</style></head><body>
<div class="top"><div class="next">Next: Day A · Sun 8 AM</div><div class="upd">Thu, Nov 19</div></div>
<div class="bars">
<div class="bar"><div class="lab">Back <b>21/14</b></div><div class="track"><div class="fill" style="width:100%"></div></div></div>
<div class="bar"><div class="lab">Push <b>7/10</b></div><div class="track"><div class="fill part" style="width:70%"></div></div></div>
<div class="bar"><div class="lab">Legs <b>7/10</b></div><div class="track"><div class="fill part" style="width:70%"></div></div></div>
<div class="bar"><div class="lab">Core <b>8/9</b></div><div class="track"><div class="fill part" style="width:89%"></div></div></div>
</div>
<h2>Beat in Day A</h2>
<div class="grid">
<div class="t"><span>Y/T/W</span><span>15 · 1 kg</span></div>
<div class="t"><span>Side plank</span><span>L45s R35s</span></div>
<div class="t"><span>Decline push-ups</span><span>22</span></div>
<div class="t"><span>Split squats</span><span>30 · 6 kg</span></div>
<div class="t"><span>DB rows</span><span>3×12 · 8 kg</span></div>
</div>
</body></html>
