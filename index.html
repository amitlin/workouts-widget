<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<title>Workouts</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1c1c1e;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
body{padding:18px 18px 24px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.next{font-size:22px;font-weight:700}
.upd{font-size:12px;color:#8e8e93}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.bar .lab{font-size:13px;color:#aeaeb2;margin-bottom:4px;display:flex;justify-content:space-between}
.bar .lab b{color:#f2f2f7;font-weight:600}
.track{height:8px;border-radius:4px;background:#3a3a3c;overflow:hidden}
.fill{height:100%;border-radius:4px;background:#30d158}
.fill.part{background:#ffd60a}
h2{font-size:15px;color:#8e8e93;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #2c2c2e;font-size:16px}
.row span:last-child{color:#30d158;font-weight:600;text-align:right}
</style></head><body>
<div class="top"><div class="next">Next: Day A · Sun 8 AM</div><div class="upd">Thu, Nov 19</div></div>
<div class="bars">
<div class="bar"><div class="lab">Back <b>21/14</b></div><div class="track"><div class="fill" style="width:100%"></div></div></div>
<div class="bar"><div class="lab">Push <b>7/10</b></div><div class="track"><div class="fill part" style="width:70%"></div></div></div>
<div class="bar"><div class="lab">Legs <b>7/10</b></div><div class="track"><div class="fill part" style="width:70%"></div></div></div>
<div class="bar"><div class="lab">Core <b>8/9</b></div><div class="track"><div class="fill part" style="width:89%"></div></div></div>
</div>
<h2>Beat in Day A</h2>
<div class="row"><span>Y, T, W raises</span><span>15 reps · 1 kg</span></div>
<div class="row"><span>Side plank</span><span>L 45s · R 35s</span></div>
<div class="row"><span>Decline push-ups</span><span>22</span></div>
<div class="row"><span>Split squats</span><span>30/leg · 6 kg</span></div>
<div class="row"><span>Dumbbell rows</span><span>3×12 · 8 kg</span></div>
</body></html>
